services:
  db:
    image: postgres:16-alpine
    container_name: atelieraranier_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier_pass}
      POSTGRES_DB: ${POSTGRES_DB:-atelieraranier}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelier_user} -d ${POSTGRES_DB:-atelieraranier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: atelieraranier_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelier_user}:${POSTGRES_PASSWORD:-atelier_pass}@db:5432/${POSTGRES_DB:-atelieraranier}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: atelieraranier_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: atelieraranier_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --poll 1000
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: atelieraranier_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
  frontend_node_modules:
