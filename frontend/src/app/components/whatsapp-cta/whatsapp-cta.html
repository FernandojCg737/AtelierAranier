<section class="whatsapp-cta">
  <div class="whatsapp-cta__title">
    <span class="whatsapp-cta__eyebrow">Pedidos</span>
    <h2>
      <span class="whatsapp-cta__line-1">No encuentras</span>
      <span class="whatsapp-cta__line-2">tu talla?</span>
    </h2>
  </div>

  <div class="whatsapp-cta__body">
    <p>
      Nuestro servicio de pedidos especiales te permite conseguir la prenda y talla exacta que
      buscas, aunque no este en el catalogo. Consulta disponibilidad directo con nosotros.
    </p>

    <a class="whatsapp-cta__btn" [href]="whatsappUrl()" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
        />
      </svg>
      <span>Solicitar por WhatsApp</span>
    </a>
  </div>
</section>
