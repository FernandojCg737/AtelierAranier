# -Xmx8G era demasiado para una maquina de 15G corriendo Docker + el
# emulador de Android a la vez -- el daemon de Gradle se quedaba sin
# memoria nativa y crasheaba (ver hs_err_pid*.log). 3G alcanza de sobra
# para este proyecto.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El proyecto vive en D: y la cache de Gradle/Kotlin en C:, lo que rompe el
# calculo de rutas relativas del compilador incremental de Kotlin en Windows
# ("this and base files have different roots"). Se desactiva el incremental
# para evitar el crash del daemon; no afecta el resultado, solo la velocidad
# de rebuilds.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
